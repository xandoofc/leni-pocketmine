chunk-gc:
  limit: 512
  period: 600
chunk-sending:
  compression-level: 7
  per-tick: 4
chunk-ticking:
  clear-tick: 200
  light-updates: false
  per-tick: 2
  tick-radius: 4
debug:
  commands: false
  ignored-packets:
  - login
  - text
  - move_player
  - move_entity
  - tick_sync
  - level_chunk
  - batch
  - add_player
  - remove_player
  - update_block
  - update_attributes
  level: 1
language: eng
level:
  chunks-per-tick: 4
  clear-tick: 200
  default-format: leveldb
  spawn-protection: 0
  spawn-radius: 0
memory:
  asynchronous-workers: 2
  global-limit: 0
  main-dedicated-memory: 512
  main-hard-limit: 1024
  main-limit: 0
network:
  max-mtu-size: 1000
resource-pack:
  minimal-bedrock-protocol: 944
settings:
  async-chunk-request: true
  enable-dev-builds: true
  enable-snooper: false
  query-plugins: false
  save-player-data: true
  send-chunk-radius: 4
  shutdown-timeout: 15
upnp: false
